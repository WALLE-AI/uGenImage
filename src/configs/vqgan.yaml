# 阶段 1：VQGAN(实为 VQ-VAE) 训练配置
# 本文件是超参的唯一真相。覆盖单个值：
#   python train_vqgan.py --config configs/vqgan.yaml --set train.lr=5e-5 data.batch_size=64

data:
  # 本机已有约 48 万张 >=256px 的 LAION 图片，无需下载
  image_dir: /home/dataset0/images/ALLaVA-4V/allava_laion/image_chunks/images
  image_size: 256
  batch_size: 32          # 全局 batch（DDP 下会按进程数均分）
  num_workers: 16
  val_size: 2000
  limit: null             # 设成整数可只用前 N 张快速试跑
  recursive: false

model:
  # quantizer: legacy = 方案 A 原实现(实验 E0) | v2 = 低维+L2+EMA+死码复活
  quantizer: v2
  codebook_size: 16384
  embedding_dim: 256      # 编码器输出维度
  code_dim: 8             # 量化维度。=embedding_dim 则不做低维投影
  l2_norm: true           # 码字与输入都 L2 归一化 -> 余弦距离，范数不再影响竞争
  ema: true               # 码本用 EMA 更新而非梯度
  decay: 0.99
  revive: true            # 长期未命中的码字用当前 batch 的编码器输出重置
  revive_after: 100       # 连续 N 步未命中就用当前 batch 的编码器输出重置该码字
  commitment_cost: 0.25
  # T2 主干: legacy = 纯 Conv+ReLU(方案A原实现) | v2 = ResBlock+GroupNorm+SiLU+瓶颈注意力
  backbone: legacy
  ch: 128
  ch_mult: [1, 1, 2, 2, 4]
  num_res_blocks: 2
  attn_resolutions: [16]

train:
  run_dir: runs/vqgan
  max_steps: 200000
  lr: 1.0e-4              # 原 yaml 的 4.5e-6 是带判别器时的配置，本实现无判别器
  weight_decay: 0.01
  lr_schedule: cosine     # cosine | constant
  warmup_steps: 2000
  min_lr_ratio: 0.1
  grad_clip: 1.0
  grad_accum: 1           # 显存不够时调大，等效 batch 不变
  amp: true
  amp_dtype: float16      # 开对抗训练时建议改 bfloat16（fp16 下自适应权重的梯度范数易下溢）
  # T3 损失。perceptual_weight=0 且 disc_start=null 时完全等价于基线
  perceptual_weight: 0.0
  perceptual_backbone: vgg16   # vgg16 | resnet50
  disc_start: null        # 设为整数(如 20000)即在该步开启对抗损失
  disc_weight: 0.8
  disc_lr: 1.0e-4
  ema_decay: null         # 例如 0.999 开启 EMA
  seed: 0
  resume: auto            # auto = 自动接上 run_dir/ckpt/latest.pt；也可填具体路径
  log_every: 100
  eval_every: 2000
  eval_batches: 30
  save_every: 5000
  keep_last: 3
  save_weights_only: false  # true = 只存权重(体积 1/3)，但无法续训
  tensorboard: false

# 训练时重点盯 codebook_usage：本实现无 EMA、无死码复活，坍塌风险高。
# 若使用率持续低于 10%，说明码本已坍塌，继续训练没有意义（见 SCHEME_B_OPTIMIZED.md B.2.2）。
