# 阶段 3：Transformer prior 训练配置
# 本文件是超参的唯一真相。覆盖单个值：
#   python train_transformer.py --config configs/transformer.yaml --set train.lr=1e-4

data:
  token_dir: data/tokens_train
  batch_size: 64          # 全局 batch = world_size * grad_accum * 每卡 micro-batch
  num_workers: 8
  val_size: 2000
  limit: null

model:
  dim: 2048
  n_layers: 20
  n_heads: 24             # 注意 n_heads * head_dim = 3072 != dim = 2048（方案 A 原样保留）
  n_kv_heads: 6           # GQA 4:1
  head_dim: 128
  vocab_size: 1027        # 与 constants.py 保持一致：PAD+BOS+MASK+1024
  seq_len: 257            # BOS + 16x16
  init_std: 0.02          # null = 复现原行为(nn.Embedding 默认 N(0,1))，初始 CE 约 1742
  # 以下为方案 A 原行为；P1 修正版见 configs/transformer_p1.yaml
  swiglu_expansion: 4     # null = 标准 8/3 比例（方案 A 的 4 使 FFN 多耗 50% FLOPs）
  qk_norm: false
  rope: 1d                # 1d | 2d（图像是二维网格，1d 是错误先验）
  tie_embeddings: true
  latent_size: 16

train:
  run_dir: runs/transformer
  max_steps: 300000
  lr: 3.0e-4
  weight_decay: 0.1       # norm/bias/embedding 自动排除
  lr_schedule: cosine
  warmup_steps: 2000
  min_lr_ratio: 0.1
  grad_clip: 1.0
  grad_accum: 1
  mask_ratio: 0.2         # 走双向掩码目标的概率（不是被掩 token 的比例）
  mask_prob: 0.15         # 掩码分支中被掩 token 的比例
  amp: true
  ema_decay: null
  seed: 0
  resume: auto
  log_every: 50
  eval_every: 1000
  eval_batches: 20
  save_every: 5000
  keep_last: 2            # 1.32B 的全量 checkpoint 约 16GB/个，注意磁盘
  save_weights_only: false  # true = 只存权重(体积 1/3)，但无法续训
  tensorboard: false

# 实测参数量约 1.32B（非 0.39B）。复核: python scripts/count_params.py
# 48 万张图 ≈ 1.23 亿 token，对 1.32B 的模型仍偏少，注意过拟合（盯 val_loss）。
