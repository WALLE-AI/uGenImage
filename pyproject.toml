[project]
name = "ugenimage"
version = "0.1.0"
description = "两阶段离散图像生成：VQGAN tokenizer + LLaMA 式自回归 prior（方案 A）"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "pillow",
    "numpy",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
